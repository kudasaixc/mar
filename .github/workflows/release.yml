name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Build package artifact
        run: npm pack --provenance=false --pack-destination . && mv kudasaixc-mar-*.tgz mar-npm.tgz
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" mar-npm.tgz --verify-tag --generate-notes --title "MAR $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm when configured
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --provenance
          else
            echo "NPM_TOKEN is not configured; skipped npm publication."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
